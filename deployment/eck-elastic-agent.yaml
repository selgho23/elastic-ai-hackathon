# Elastic Agent CR — DaemonSet agent for Kubernetes monitoring.
# Enrolls into Fleet Server and uses the k8s-monitoring-policy defined in Kibana.
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: elastic-agent
  namespace: elastic
spec:
  version: 9.3.0
  mode: fleet
  fleetServerRef:
    name: hackathon
    namespace: elastic
  kibanaRef:
    name: hackathon
    namespace: elastic
  policyID: k8s-monitoring-policy
  daemonSet:
    podTemplate:
      spec:
        automountServiceAccountToken: true
        serviceAccountName: elastic-agent
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsUser: 0
        tolerations:
        - operator: Exists
        containers:
        - name: agent
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1
          volumeMounts:
          - name: proc
            mountPath: /hostfs/proc
            readOnly: true
          - name: cgroup
            mountPath: /hostfs/sys/fs/cgroup
            readOnly: true
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
            readOnly: true
          - name: varlog
            mountPath: /var/log
            readOnly: true
          - name: etc-kubernetes
            mountPath: /hostfs/etc/kubernetes
            readOnly: true
          - name: etc-machine-id
            mountPath: /etc/machine-id
            readOnly: true
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlog
          hostPath:
            path: /var/log
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: etc-machine-id
          hostPath:
            path: /etc/machine-id
