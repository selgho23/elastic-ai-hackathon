eck-elasticsearch:
  # Cluster name = Kubernetes Elasticsearch resource name. Change this to rename the cluster.
  fullnameOverride: "hackathon"

  nodeSets:
  - name: default
    count: 2
    config:
      node.roles: ["master", "data", "ingest"]
      node.store.allow_mmap: false
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 4Gi
              cpu: 1
            limits:
              memory: 8Gi
              cpu: 2
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi